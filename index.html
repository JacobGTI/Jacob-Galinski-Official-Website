<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob | Portfolio</title>
    <style>
        /* Basic Reset & Clean Dark Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 650px;
            margin: auto;
            width: 100%;
        }

        /* Header Style */
        header {
            margin-bottom: 2.5rem;
        }
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #00adb5; /* Sleek Tech Cyan Accent */
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Content Sections */
        section {
            margin-bottom: 2.5rem;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        /* Basic Project Links */
        .links-list {
            list-style: none;
        }
        .links-list li {
            margin-bottom: 0.75rem;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        a:hover {
            color: #00adb5;
        }
        .link-desc {
            display: block;
            font-size: 0.9rem;
            color: #707070;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding-top: 2rem;
            border-top: 1px solid #222;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Jacob</h1>
            <div class="subtitle">Builder & Engineering Student</div>
        </header>

        <main>
            <section>
                <p>Welcome to my site. I use this space to log my hands-on builds, hardware documentation, and software projects.</p>
            </section>

            <section>
                <h2 style="color: #fff; font-size: 1.3rem; margin-bottom: 1rem;">Projects & Code</h2>
                <ul class="links-list">
                    <li>
                        <a href="https://github.com" target="_blank">GitHub Profile &rarr;</a>
                        <span class="link-desc">Repositories for my active builds, schematics, and source code.</span>
                    </li>
                    <!-- Add more project links below as you get them up -->
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Jacob. Built with plain HTML & CSS.</p>
        </footer>
    </div>

</body>
</html>
